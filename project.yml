name: BanglaKeyboard
options:
  bundleIdPrefix: com.mirailit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer Team ID here (needed for App Group + keychain sharing on device).
    DEVELOPMENT_TEAM: "Z44VP4X9VR"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BanglaKit:
    path: BanglaKit
targets:
  BanglaKeyboard:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BanglaKit
      - target: BanglaKeyboardExtension
        embed: true
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mirailit.BanglaKeyboard]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.mirailit.BanglaKeyboard.shared"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bangla AI
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        KeychainAccessGroup: "$(AppIdentifierPrefix)com.mirailit.BanglaKeyboard.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirailit.BanglaKeyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BanglaKeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [KeyboardExtension]
    dependencies:
      - package: BanglaKit
    entitlements:
      path: KeyboardExtension/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mirailit.BanglaKeyboard]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.mirailit.BanglaKeyboard.shared"]
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Bangla AI
        KeychainAccessGroup: "$(AppIdentifierPrefix)com.mirailit.BanglaKeyboard.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: bn-BD
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirailit.BanglaKeyboard.Keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
